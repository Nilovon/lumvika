# Lumvika on one machine: the web app, its database, its file store and the engine of your first workspace.
#
#   cp .env.example .env && node scripts/self-host-check.mjs   # fills the secrets, checks the rest
#   docker compose up -d --build
#
# Every start runs `migrate` first: it applies the database migrations, creates the storage buckets
# and loads the services catalog into an empty database, then the app starts. See
# https://docs.lumvika.com/self-host.
name: lumvika

x-app-build: &app-build
  context: .
  dockerfile: apps/ui/Dockerfile
  args:
    NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-http://localhost:3002}
    NEXT_PUBLIC_SOURCE_REPO_URL: ${NEXT_PUBLIC_SOURCE_REPO_URL:-}
    NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-}
    NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
    NEXT_PUBLIC_ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    NEXT_PUBLIC_OAUTH_PROVIDERS: ${NEXT_PUBLIC_OAUTH_PROVIDERS:-}
    NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_HCAPTCHA_SITE_KEY:-}

# Where the app and the migrate step find the database and the file store: the two services below,
# unless `.env` points DATABASE_URL or S3_ENDPOINT somewhere else.
x-data-env: &data-env
  DATABASE_URL: ${DATABASE_URL:-postgres://lumvika:${POSTGRES_PASSWORD}@postgres:5432/lumvika}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
  # The address a browser opens a signed download link at: the published store, not the internal one.
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${NEXT_PUBLIC_STORAGE_URL}}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-lumvika}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: lumvika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumvika
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumvika -d lumvika"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Any S3-compatible store works in its place (R2, AWS, MinIO): set S3_* in `.env`.
  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-lumvika}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    # Browsers load avatars, logos and template images straight from here (NEXT_PUBLIC_STORAGE_URL).
    ports:
      - "${LUMVIKA_STORAGE_PORT:-3002}:9000"
    volumes:
      - storage-data:/data
    restart: unless-stopped

  migrate:
    build: *app-build
    working_dir: /app
    command: ["node", "scripts/db.mjs", "migrate"]
    env_file: .env
    environment: *data-env
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    restart: "no"

  app:
    build: *app-build
    env_file: .env
    environment:
      <<: *data-env
      # The engine below goes to the first workspace that needs one.
      LUMVIKA_ENGINE_URL: http://engine:3000
      LUMVIKA_ENGINE_API_KEY: ${LUMVIKA_ENGINE_API_KEY}
      # Where a browser reaches the engine below, to watch a coworker's screen.
      LUMVIKA_ENGINE_BROWSER_URL: ${LUMVIKA_ENGINE_BROWSER_URL:-http://localhost:3001}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${LUMVIKA_APP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    environment:
      LUMVIKA_API_KEY: ${LUMVIKA_ENGINE_API_KEY}
      LUMVIKA_HUB_BASE_URL: http://app:3000
      LUMVIKA_LOG_LEVEL: ${LUMVIKA_LOG_LEVEL:-info}
    ports:
      - "${LUMVIKA_ENGINE_PORT:-3001}:3000"
    volumes:
      - engine-data:/data
    # The engine calls your own model when you connect one: Ollama or LM Studio on this machine
    # answer it at host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 2 GB of shared memory keeps Chromium from crashing on heavy pages.
    shm_size: 2gb
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
  engine-data:

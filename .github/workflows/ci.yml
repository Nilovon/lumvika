name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumvika/contracts build
      - run: pnpm -r --if-present ts-check
      - run: pnpm --filter lumvika lint
      - run: pnpm --filter lumvika test
      - run: pnpm --filter lumvika-engine test

  database:
    name: Migrations, seed and row level security on a fresh database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: lumvika
          POSTGRES_PASSWORD: lumvika
          POSTGRES_DB: lumvika
        ports:
          - 54432:5432
        options: >-
          --health-cmd "pg_isready -U lumvika -d lumvika"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      storage:
        image: rustfs/rustfs:1.0.4
        env:
          RUSTFS_ACCESS_KEY: lumvika
          RUSTFS_SECRET_KEY: lumvika-secret
        ports:
          - 54437:9000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/db.mjs migrate
      - run: pnpm --filter @lumvika/db test

  # The images take ~20 minutes to build: a pull request only builds them when it touches what
  # goes into them beyond the code the other jobs already check, and every push to master and
  # staging builds them anyway before anything ships.
  docker-inputs:
    if: github.event_name == 'pull_request'
    name: Docker inputs changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '(^|/)Dockerfile$|(^|/)\.dockerignore$|^docker-compose\.yml$|(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^apps/ui/next\.config\.|^\.github/workflows/ci\.yml$'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: docker-inputs
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.docker-inputs.outputs.changed == 'true')
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      # Both images fill the runner's disk: the preinstalled toolchains they never use take ~30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/engine/Dockerfile
          push: false
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
      - name: App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ui/Dockerfile
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

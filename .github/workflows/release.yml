name: Release

# Builds the two public images docker-compose.yml runs: ghcr.io/<owner>/lumvika-app and lumvika-engine.
# The Version workflow calls it on every push to main; a tag pushed by hand runs it too. Each platform
# builds on a native runner (an arm64 Next.js build under QEMU takes hours), then one manifest per tag
# joins them.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      sha:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        image: [app, engine]
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      # The images fill the runner's disk ("No space left on device" on v0.1.0): the preinstalled
      # toolchains they never use take ~30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR rejects upper case, and the owner is "Nilovon".
      - id: target
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "name=ghcr.io/${OWNER,,}/lumvika-${{ matrix.image }}"
            echo "dockerfile=apps/${{ matrix.image == 'app' && 'ui' || 'engine' }}/Dockerfile"
            echo "pair=${{ matrix.image }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.target.outputs.name }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ steps.target.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_BUILD_SHA=${{ inputs.sha || github.sha }}
            NEXT_PUBLIC_SOURCE_REPO_URL=${{ github.server_url }}/${{ github.repository }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.target.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.target.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.target.outputs.pair }}
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.target.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [app, engine]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - id: target
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/lumvika-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.target.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}
      - name: Create the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.target.outputs.name }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ steps.target.outputs.name }}:${{ steps.meta.outputs.version }}

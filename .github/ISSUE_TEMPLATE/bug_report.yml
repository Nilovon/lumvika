name: Bug report
description: Something does not work as the docs say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs app engine`, with any key removed."
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit you run.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How you run it
      options: [docker compose, Dokploy or Coolify, from source, other]
    validations:
      required: true
